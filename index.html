<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>What's for Dinner?</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="Family meal planning — vote, plan, and cook together.">
  <meta name="theme-color" content="#C8553D">
  <!-- PWA-ready -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
</head>
<body>

  <!-- Top Navigation -->
  <nav class="top-nav hidden" id="app-nav">
    <div class="top-nav-inner">
      <div class="nav-brand">
        🍽️ <span>Dinner?</span>
      </div>
      <div class="nav-user">
        <strong id="nav-user-name"></strong>
        <button class="nav-signout" id="signout-btn" title="Sign out">↩</button>
      </div>
    </div>
  </nav>

  <!-- Main content area (views render here) -->
  <main class="app-shell" id="app-content" role="main"></main>

  <!-- Bottom Navigation (hidden on desktop via CSS) -->
  <nav class="bottom-nav hidden" id="bottom-nav" aria-label="Main navigation">
    <a href="#/vote" aria-label="Vote">
      <span class="nav-icon">🗳️</span>
      Vote
    </a>
    <a href="#/plan" aria-label="This week's plan">
      <span class="nav-icon">📅</span>
      Plan
    </a>
    <a href="#/suggest" aria-label="Suggest a meal">
      <span class="nav-icon">💬</span>
      Suggest
    </a>
    <a href="#/admin" aria-label="Admin" data-admin-only style="display:none;">
      <span class="nav-icon">⚙️</span>
      Admin
    </a>
  </nav>

  <!-- Toast container (js/ui.js appends toasts here) -->
  <div class="toast-container" aria-live="polite"></div>

  <!-- App entry point (ES module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
